- id: ggplot2-sf
  title: ggplot2 with geom_sf
  icon: lucide/palette
  summary: ggplot2's geom_sf and coord_sf layers draw sf objects in R using the grammar of graphics, with automatic projection handling.
  provider: Posit and r-spatial
  platform: [Windows, macOS, Linux]
  language: [R]
  interface: [Library]
  license: MIT
  cost: Open source
  status: Active
  access: https://ggplot2.tidyverse.org/reference/ggsf.html
  docs: https://r-spatial.org/r/2018/10/25/ggplot2-sf.html
  repo: https://github.com/tidyverse/ggplot2
  tags: [MIT, Cartography, Visualization, r-spatial]
  snippets:
    - label: R
      lang: r
      code: |
        library(ggplot2); library(sf)
        nc <- st_read(system.file("shape/nc.shp", package = "sf"))
        ggplot(nc) + geom_sf(aes(fill = AREA)) + coord_sf(crs = 5070)
  related: [sf, ggspatial, tmap]
