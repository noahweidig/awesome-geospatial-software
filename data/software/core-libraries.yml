- id: gdal
  title: GDAL
  icon: lucide/library
  summary: The translator library for raster and vector geospatial formats, with the gdal and ogr2ogr command line tools and bindings for Python, Java, C# and others.
  provider: OSGeo
  platform: [Windows, macOS, Linux]
  language: [C++, C, Python]
  interface: [Library, Command line]
  license: MIT
  cost: Open source
  status: Active
  access: https://gdal.org/en/stable/download.html
  docs: https://gdal.org/en/stable/
  repo: https://github.com/OSGeo/gdal
  tags: [MIT, Raster, Vector, Cloud-native, OSGeo]
  snippets:
    - label: Command line
      lang: bash
      code: |
        gdalinfo dem.tif
        ogr2ogr -f GPKG out.gpkg in.shp
        gdalwarp -t_srs EPSG:4326 in.tif out.tif
    - label: Python
      lang: python
      code: |
        from osgeo import gdal
        ds = gdal.Open("dem.tif")
        print(ds.RasterXSize, ds.RasterYSize, ds.GetProjection()[:40])
  related: [proj, geos, rasterio, pyogrio, terra]
